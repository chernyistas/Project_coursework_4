{% extends 'base.html'%}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>{% if object %}Редактировать{% else %}Создать{% endif %} рассылку</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">
                            {% if object %}Сохранить{% else %}Создать{% endif %}
                        </button>
                        <a href="{% url 'mailings:list' %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
